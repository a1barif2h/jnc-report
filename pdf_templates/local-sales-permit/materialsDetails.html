{{headerHere}}
<div class="export-material">
  <div class="export-material-details">
    <h3>Local Sales Permit Details</h3>
  </div>
  <div class="border-box product-details">
    <div class="left">
      <div>
        <small>Type of Material: </small>
        <p>{{typeOfMaterial}}</p>
      </div>
      <div>
        <small>Quantity: </small>
        <p>{{quantity}}</p>
      </div>
      <div>
        <small>Material Description: </small>
        <p>{{materialDescription}}</p>
      </div>
    </div>
    <div class="right">
      <div>
        <small>Unit of Quantity: </small>
        <p>{{unitOfQuantity}}</p>
      </div>
      <div>
        <small>Unit Price :</small>
        <p>BDT {{unitPrice}}</p>
      </div>
      <div>
        <small>HS Code: </small>
        <p>{{hsCode}}</p>
      </div>
      <div>
        <small></small>
        <p>{{hsCodeDetails}}</p>
      </div>
    </div>
  </div>
</div>
{{footerHere}}
