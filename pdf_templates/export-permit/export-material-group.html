{{headerHere}}
<div class="export-material">
  {{materialLabel}}
  <div class="export-material-details" style="margin-top: 0.1rem">
    <h3>Export Material Details</h3>
  </div>
  <div class="border-box product-details">
    <div class="left">
      <div class="product-description">
        <small>Product Description: </small>
        <p>{{productDescription}}</p>
      </div>
      <div>
        <small>{{fobValue1}}: </small>
        <p>{{fobCurrencyValue1}} {{foBCurrency1}}</p>
      </div>
    </div>
    <div class="right">
      <div>
        <small>HS Code: </small>
        <p>{{hsCode}}</p>
      </div>
      <div>
        <small></small>
        <p>{{hsCodeDetails}}</p>
      </div>
      <div>
        <small>Unit of Quantity: </small>
        <p>{{unitQuantity}}</p>
      </div>
      <div>
        <small>Quantity: </small>
        <p>{{quantity}}</p>
      </div>
    </div>
  </div>
</div>
