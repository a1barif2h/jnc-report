{{headerHere}}
<div class="export-material">
  {{materialLabel}}
  <div class="export-material-details">
    <h3>TT/ P.O/ SC/ CM/ L/C Information</h3>
  </div>
  <div class="border-box">
    <div class="left">
      <div>
        <small>{{ttNo}}: </small>
        <p>{{ttNoInput}}</p>
      </div>
      <div>
        <small>Issuing Bank: </small>
        <p>{{issuingBank}}</p>
      </div>
      <div>
        <small>Issue Date: </small>
        <p>{{issueDate}}</p>
      </div>
    </div>
    <div class="right">
      <div>
        <small>{{ttNo}} Value: </small>
        <p>{{ttvalueHidden}} {{ttCurrencyValueHidden}}</p>
      </div>
      <div>
        <small>Type: </small>
        <p>{{typeOfLC}}</p>
      </div>
      <div>
        <small>Expire Date: </small>
        <p>{{expiryDate}}</p>
      </div>
    </div>
  </div>
  {{footerHere}}
</div>
