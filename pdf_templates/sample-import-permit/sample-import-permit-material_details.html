{{headerHere}}
<div class="export-material">
  {{materialLabel}}
  <div class="export-material-details">
    <h3>Product Details</h3>
  </div>
  <div class="border-box product-details">
    <div class="left">
      <div>
        <small>Description:</small>
        <p>{{productDescription}}</p>
      </div>
      <div>
        <small>HS Code :</small>
        <p>{{hsCode}}</p>
      </div>
      <div>
        <small></small>
        <p>{{hsCodeDetails}}</p>
      </div>
    </div>
    <div class="right">
      <div>
        <small>Sample Value :</small>
        <p>{{sampleValue}} {{currency}}</p>
      </div>
      <div>
        <small>Sample Quantity :</small>
        <p>{{sampleQuantity}}</p>
      </div>
      <div>
        <small>Unit of Quantity :</small>
        <p>{{unitQuantity}}</p>
      </div>
      <div></div>
    </div>
  </div>
  {{footerHere}}
</div>
