apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ .Chart.Name }}-gateway
spec:
  selector:
    istio: ingressgateway # use istio default controller
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Chart.Name }}
spec:
  hosts:
  - "*"
  gateways:
  - {{ .Chart.Name }}-gateway
  http:
  - match:
    - uri:
        exact: / 
    route:
    - destination:
        host: {{ .Chart.Name }}
        port:
          number: {{ .Values.variables.serviceTargetPort }}
