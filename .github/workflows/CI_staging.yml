# This is a basic workflow to help you get started with Actions

name: CI_staging

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ staging ]
  # pull_request:
  #   branches: [ staging ]

  # Allows you to run this workflow manually from the Actions tab
  # workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:       
      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - name: "docker build"
        run: "docker build -t beza-certificate-service -f Dockerfile.staging ."
    
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      # - name: Read Helm Chart
      #   id: chart
      #   uses: jacobtomlinson/gha-read-helm-chart@master
      #   with:
      #     path: deploy/
                  
      - name: "docker tag"
        run: "docker tag beza-certificate-service  ${{ secrets.DOCKER_USER }}/beza-certificate-service-staging:latest"        

      - name: "docker push"
        run: "docker push  ${{ secrets.DOCKER_USER }}/beza-certificate-service-staging:latest" 
        
      - name: Helm re-deploy 
        uses: appleboy/ssh-action@master
        with:
          host: "122.152.48.180"
          username: "bstg01"
          password: "qazwsx@321"  
          port: 5090
          script: |
            export KUBECONFIG="~/.kube/config:/etc/rancher/k3s/k3s.yaml"
            cd /home/bstg01/oss/oss-helm-deploy-staging/beza-certificate-service
            helm uninstall beza-certificate-service-staging --namespace staging
            helm install beza-certificate-service-staging --namespace staging ./

            
